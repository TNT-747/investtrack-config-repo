# Gateway Service Configuration

server.port=8080
spring.application.name=gateway-service

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Spring Cloud Gateway Routes
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Explicit route configurations
# Route 1: Market Service - handles /api/market/** and /api/assets/**
spring.cloud.gateway.routes[0].id=market-service
spring.cloud.gateway.routes[0].uri=lb://market-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/market/**,/api/assets/**

# Route 2: Wallet Service - handles /api/wallet/**
spring.cloud.gateway.routes[1].id=wallet-service
spring.cloud.gateway.routes[1].uri=lb://wallet-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/wallet/**,/api/wallets/**

# JWT Configuration
jwt.secret=InvestTrackSecretKey2024ForJWTTokenGenerationAndValidation
jwt.expiration=86400000

# CORS Configuration - Allow frontend access
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origin-patterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Logging
logging.level.com.investtrack.gateway=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty=INFO
