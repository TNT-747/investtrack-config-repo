# Wallet Service Configuration

server.port=8082
spring.application.name=wallet-service

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/walletdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OpenFeign Configuration
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.marketService.sliding-window-size=10
resilience4j.circuitbreaker.instances.marketService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.marketService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.marketService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.marketService.automatic-transition-from-open-to-half-open-enabled=true

# Custom Configuration - Transaction History Filter
invest-config.wallet.history-days=30

# Logging
logging.level.com.investtrack.wallet=DEBUG
logging.level.org.hibernate.SQL=DEBUG
